<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito | E-Store</title>
  <meta name="description" content="Revisa tu carrito en E-Store: subtotal, descuento por volumen, envío y total de tu compra.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#101214">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/logo.jpg">
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html"><img src="assets/logo.jpg" alt="Logo de E-Store"><span>E-Store</span></a>
      <nav class="menu">
        <a href="index.html">Inicio</a><a href="productos.html">Productos</a><a href="ofertas.html">Ofertas</a><a href="nosotros.html">Nosotros</a>
      </nav>
      <div class="nav-actions">
        <button class="icon-button" type="button" data-header-search-toggle aria-label="Buscar productos" aria-expanded="false">⌕</button>
        <a class="btn btn-primary cart-button is-active" href="carrito.html">Carrito <span>0</span></a>
      </div>
    </div>
  </header>

  <main class="page-content">
    <section class="container">
      <p class="eyebrow">Tu selección</p>
      <h1>Carrito de compras</h1>
      <div class="cart-layout">
        <div class="cart-items" id="cart-items"></div>
        <aside class="order-summary">
          <h2>Resumen del pedido</h2>
          <div class="summary-line"><span>Subtotal</span><strong id="cart-subtotal">S/ 0</strong></div>
          <div class="summary-line"><span>Descuento</span><strong id="cart-discount">S/ 0</strong></div>
          <div class="summary-line"><span>Envío</span><strong id="cart-shipping">S/ 15</strong></div>
          <p class="shipping-note">Envío gratis desde S/ 500.</p>
          <div class="summary-total"><span>Total</span><strong id="cart-total">S/ 15</strong></div>
          <a class="btn btn-primary checkout-button" id="checkout-link" href="entrega.html">Continuar con la entrega</a>
          <a class="back-link" href="productos.html">← Seguir comprando</a>
        </aside>
      </div>
    </section>
  </main>

  <footer class="site-footer"><div class="container"><p>© 2026 E-Store. Todos los derechos reservados.</p></div></footer>
  <script src="scripts/carrito.js"></script>
  <script src="scripts/product-images.js"></script>
  <script src="scripts/catalog-store.js"></script>
  <script src="scripts/admin-auth.js"></script>
  <script src="scripts/header-search.js"></script>
  <script src="scripts/whatsapp.js"></script>
</body>
</html>
