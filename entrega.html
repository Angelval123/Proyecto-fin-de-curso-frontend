<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrega | E-Store</title>
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html"><img src="assets/logo.jpg" alt="Logo de E-Store"><span>E-Store</span></a>
      <nav class="menu">
        <a href="index.html">Inicio</a><a href="productos.html">Productos</a><a href="ofertas.html">Ofertas</a><a href="nosotros.html">Nosotros</a>
      </nav>
      <div class="nav-actions">
        <a class="icon-button" href="productos.html#buscador" aria-label="Buscar productos">⌕</a>
        <a class="btn btn-primary cart-button" href="carrito.html">Carrito <span>0</span></a>
      </div>
    </div>
  </header>

  <main class="page-content">
    <section class="container">
      <p class="eyebrow">Paso 2 de 2</p>
      <h1>Datos de entrega</h1>
      <div class="delivery-layout">
        <form class="delivery-form" id="delivery-form">
          <fieldset>
            <legend>Identificación y contacto</legend>
            <div class="form-grid">
              <label>Nombre completo<input name="name" type="text" placeholder="Ej. Ana García" required></label>
              <label>DNI<input name="dni" type="text" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" placeholder="8 dígitos" required></label>
              <label>Teléfono<input name="phone" type="tel" placeholder="987 654 321" required></label>
              <label>Correo electrónico<input name="email" type="email" placeholder="tu@correo.com" required></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>Dirección de entrega</legend>
            <div class="form-grid">
              <label class="form-wide">Dirección<input name="address" type="text" placeholder="Av. Arequipa 123, departamento 402" required></label>
              <label>Distrito<input name="district" type="text" placeholder="Miraflores" required></label>
              <label>Referencia<input name="reference" type="text" placeholder="Cerca del parque" required></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>Horario de entrega</legend>
            <div class="schedule-options">
              <label><input type="radio" name="schedule" value="9:00 a. m. - 1:00 p. m." required><span>9:00 a. m.<strong> a 1:00 p. m.</strong></span></label>
              <label><input type="radio" name="schedule" value="2:00 p. m. - 6:00 p. m."><span>2:00 p. m.<strong> a 6:00 p. m.</strong></span></label>
              <label><input type="radio" name="schedule" value="6:00 p. m. - 9:00 p. m."><span>6:00 p. m.<strong> a 9:00 p. m.</strong></span></label>
            </div>
          </fieldset>
          <button class="btn btn-primary checkout-button" type="submit">Confirmar datos de entrega</button>
          <p class="form-success" id="form-success" role="status"></p>
        </form>
        <aside class="order-summary delivery-summary">
          <h2>Resumen del pedido</h2>
          <div id="delivery-items"></div>
          <div class="summary-line"><span>Subtotal</span><strong id="delivery-subtotal">S/ 0</strong></div>
          <div class="summary-line"><span>Envío</span><strong id="delivery-shipping">S/ 0</strong></div>
          <p class="shipping-note">Tu entrega es gratis desde S/ 500.</p>
          <div class="summary-total"><span>Total</span><strong id="delivery-total">S/ 0</strong></div>
        </aside>
      </div>
    </section>
  </main>

  <footer class="site-footer"><div class="container"><p>© 2026 E-Store. Todos los derechos reservados.</p></div></footer>
  <script src="scripts/entrega.js"></script>
  <script src="scripts/whatsapp.js"></script>
</body>
</html>
